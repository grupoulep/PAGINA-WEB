<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- ===================================================================== -->
    <!-- OBLIGAR SITIO SEGURO (HTTPS + HSTS + BLOQUEO DE CONTENIDO MIXTO)      -->
    <!-- ===================================================================== -->
    <script>
      (function () {
        var host = window.location.hostname;
        var isLocal =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === '0.0.0.0' ||
          host === '[::1]' ||
          host.endsWith('.internal') ||
          host.endsWith('.local');

        // 1. Redirección inmediata y obligatoria de HTTP a HTTPS antes de renderizar
        if (window.location.protocol === 'http:' && !isLocal) {
          document.documentElement.style.display = 'none';
          var secureUrl =
            'https://' +
            window.location.host +
            window.location.pathname +
            window.location.search +
            window.location.hash;
          window.location.replace(secureUrl);
          return;
        }

        // 2. Sanitizador en tiempo real: convierte cualquier recurso http:// a https://
        function upgradeNodeSecurity(node) {
          if (!node || node.nodeType !== 1) return;
          var attrs = ['src', 'href', 'action', 'data'];
          for (var i = 0; i < attrs.length; i++) {
            var attr = attrs[i];
            if (node.hasAttribute && node.hasAttribute(attr)) {
              var val = node.getAttribute(attr);
              if (
                val &&
                val.indexOf('http://') === 0 &&
                val.indexOf('http://localhost') !== 0 &&
                val.indexOf('http://127.0.0.1') !== 0 &&
                val.indexOf('http://www.w3.org/') !== 0
              ) {
                node.setAttribute(attr, 'https://' + val.substring(7));
              }
            }
          }
        }

        if (typeof MutationObserver !== 'undefined') {
          var observer = new MutationObserver(function (mutations) {
            for (var m = 0; m < mutations.length; m++) {
              var mutation = mutations[m];
              if (mutation.type === 'attributes') {
                upgradeNodeSecurity(mutation.target);
              } else if (mutation.addedNodes && mutation.addedNodes.length) {
                for (var n = 0; n < mutation.addedNodes.length; n++) {
                  var added = mutation.addedNodes[n];
                  upgradeNodeSecurity(added);
                  if (added && added.querySelectorAll) {
                    var children = added.querySelectorAll('[src^="http://"], [href^="http://"], [action^="http://"]');
                    for (var c = 0; c < children.length; c++) {
                      upgradeNodeSecurity(children[c]);
                    }
                  }
                }
              }
            }
          });
          observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['src', 'href', 'action'],
          });
        }
      })();
    </script>

    <!-- Políticas estrictas de seguridad del navegador (CSP, HSTS, NoSniff, Referrer) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests; block-all-mixed-content; default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https: data: blob:; connect-src 'self' https: wss:; frame-src 'self' https:; object-src 'none'; base-uri 'self';"
    />
    <meta http-equiv="Strict-Transport-Security" content="max-age=63072000; includeSubDomains; preload" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts: Montserrat (Gotham Web Equivalent) & Open Sans (fup.edu.co Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />

    <!-- Theme color for mobile browser search/address bar -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#ffffff" />
    <meta name="msapplication-TileColor" content="#0035ab" />
    <meta name="msapplication-navbutton-color" content="#0035ab" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- SEO & Identity -->
    <title>Fundación ULEP | Educación para el Trabajo y Cursos Prácticos</title>
    <meta
      name="description"
      content="Institución de Educación para el Trabajo y el Desarrollo Humano. Cursos prácticos por competencias, becas institucionales y financiación directa sin bancos."
    />
    <meta property="og:title" content="Fundación ULEP | Educación para el Trabajo" />
    <meta
      property="og:description"
      content="Formación práctica por competencias en cursos para el trabajo, modalidades flexibles y facilidades de pago directo sin intermediarios bancarios."
    />
    <meta property="og:type" content="website" />

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
